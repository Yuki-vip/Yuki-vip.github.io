<style>
:root{
  --ink:#654a56;--muted:#9a7382;--pink:#e4a2ba;--pink2:#f7dfe8;
  --cream:#fff9ee;--yellow:#ffd869;--line:#ecd9df;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{
  min-height:100vh;overflow:hidden;color:var(--ink);
  background:
    radial-gradient(circle at 10% 15%,rgba(255,217,105,.32),transparent 27%),
    radial-gradient(circle at 85% 80%,rgba(231,160,189,.28),transparent 29%),
    linear-gradient(155deg,#fffaf3 0%,#fff3f8 55%,#fffaf0 100%);
}
.stage{
  min-height:100vh;display:grid;place-items:center;padding:20px;
  position:relative;overflow:hidden;
}
.petals{position:absolute;inset:0;pointer-events:none}
.petal{
  position:absolute;width:10px;height:7px;border-radius:70% 30% 70% 30%;
  background:rgba(232,151,184,.45);animation:fall linear infinite;
}
@keyframes fall{
  from{transform:translate3d(0,-12vh,0) rotate(0)}
  to{transform:translate3d(45px,115vh,0) rotate(420deg)}
}
.shell{width:min(900px,95vw);text-align:center;position:relative;z-index:2}
.kicker{font-size:11px;letter-spacing:.18em;font-weight:900;color:#b27d91}
h1{font-size:clamp(28px,5vw,48px);margin:8px 0 7px;line-height:1.15}
.sub{margin:0 0 18px;color:var(--muted);font-size:14px;font-weight:700}
.envelope-wrap{perspective:1500px}
.envelope{
  width:min(760px,92vw);height:min(470px,66vh);min-height:420px;
  margin:auto;position:relative;transform-style:preserve-3d;
  filter:drop-shadow(0 24px 28px rgba(93,57,75,.18));
}
.back{
  position:absolute;inset:0;border-radius:22px;
  background:linear-gradient(145deg,#fffdf8,#fff4e4);
  border:1px solid #ead5c6;overflow:hidden;
}
.back:before,.back:after{
  content:"";position:absolute;bottom:-2px;width:52%;height:76%;
  background:linear-gradient(145deg,#fff9ee,#fce9d9);z-index:2;
}
.back:before{left:-1%;clip-path:polygon(0 0,100% 100%,0 100%)}
.back:after{right:-1%;clip-path:polygon(100% 0,0 100%,100% 100%)}
.flap{
  position:absolute;left:0;right:0;top:0;height:52%;z-index:6;
  transform-origin:top center;transform:rotateX(0deg);
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(180deg,#fff4df,#ffe0b6);
  border-top-left-radius:22px;border-top-right-radius:22px;
  transition:transform .8s cubic-bezier(.22,.8,.2,1);
}
.paper{
  position:absolute;left:50%;bottom:22px;width:82%;height:72%;
  transform:translateX(-50%) translateY(35%);z-index:3;
  background:rgba(255,255,255,.97);border:1px solid #efdae2;border-radius:20px;
  padding:28px 24px 22px;box-shadow:0 15px 32px rgba(104,70,86,.13);
  transition:transform .9s cubic-bezier(.2,.78,.2,1);
}
.envelope.open .flap{transform:rotateX(180deg)}
.envelope.open .paper{transform:translateX(-50%) translateY(-19%)}
.address{
  position:absolute;left:28px;top:24px;z-index:8;text-align:left;
  font-size:13px;line-height:1.65;font-weight:850;color:#956d7d
}
.address b{color:#c66f91}
.seal{
  position:absolute;left:50%;top:45%;z-index:9;transform:translate(-50%,-50%);
  width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#d57b9d,#b55c7e);color:white;font-size:26px;
  border:5px solid rgba(255,255,255,.76);box-shadow:0 8px 18px rgba(143,73,100,.24);
  transition:opacity .25s,transform .4s;
}
.envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(25deg)}
.paper h2{margin:0 0 4px;font-size:clamp(19px,3vw,28px)}
.paper p{margin:0 0 16px;color:var(--muted);font-size:12px}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.choice{
  border:1px solid var(--line);border-radius:16px;padding:13px 8px;
  background:#fff;cursor:pointer;color:#795967;font-family:inherit;
  transition:transform .18s,box-shadow .18s,border-color .18s;
  box-shadow:0 7px 16px rgba(111,74,90,.06)
}
.choice:hover,.choice:active{transform:translateY(-3px);box-shadow:0 11px 22px rgba(111,74,90,.12)}
.choice .icon{display:block;font-size:22px;margin-bottom:5px}
.choice strong{display:block;font-size:12px}
.choice small{display:block;color:#ad8796;font-size:10px;margin-top:4px}
.choice.a{background:#fffbed}.choice.b{background:#fff2f7}
.choice.c{background:#f6f3ff}.choice.d{background:#f7f2f5}
.loading{
  position:absolute;inset:0;z-index:12;display:grid;place-items:center;
  background:rgba(255,248,251,.88);backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity .35s;border-radius:22px
}
.envelope.go .loading{opacity:1}
.loading-box{font-weight:900;color:#755362}
.loading-box .big{font-size:36px;margin-bottom:8px;animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.hint{margin-top:15px;color:#b18495;font-size:11px;font-weight:750}
@media(max-width:650px){
  .stage{padding:12px}
  .shell{width:100%}
  .envelope{width:96vw;height:590px;min-height:590px}
  .paper{width:88%;height:77%;padding:24px 16px 18px}
  .choices{grid-template-columns:1fr 1fr}
  .choice{padding:12px 7px}
  .seal{top:37%}
  .address{left:20px;top:18px;font-size:12px}
  .envelope.open .paper{transform:translateX(-50%) translateY(-14%)}
}
</style>
</head>
<body>
<div class="stage">
  <div class="petals" id="petals"></div>
  <div class="shell">
    <div class="kicker">A LETTER FROM CHEESE</div>
    <h1>今晚，你想收到什麼樣的故事？</h1>
    <p class="sub">選一封信。信封打開之後，就直接前往屬於它的劇本。</p>

    <div class="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="back"></div>
        <div class="paper">
          <h2>請選擇你的信件 ♡</h2>
          <p>不用再按第二次，選好就會直接出發。</p>
          <div class="choices">
            <button class="choice a" data-story="sweet"><span class="icon">♡</span><strong>A｜甜甜的信</strong><small>歡樂・機制</small></button>
            <button class="choice b" data-story="emotion"><span class="icon">𐙚</span><strong>B｜心事的信</strong><small>情感・沉浸</small></button>
            <button class="choice c" data-story="mystery"><span class="icon">☾</span><strong>C｜神秘的信</strong><small>推理・還原</small></button>
            <button class="choice d" data-story="midnight"><span class="icon">❦</span><strong>D｜午夜的信</strong><small>恐怖・驚悚</small></button>
          </div>
        </div>
        <div class="flap"></div>
        <div class="address">💌 To. 即將成為故事主角的你<br><b>From. 芝士 ୨୧</b></div>
        <div class="seal">🧀</div>
        <div class="loading"><div class="loading-box"><div class="big" id="loadIcon">♡</div><div id="loadText">正在拆信……</div></div></div>
      </div>
    </div>
    <div class="hint">點選 A / B / C / D 後，會看到信封打開動畫，再自動進入相應劇本清單。</div>
  </div>
</div>

<script>
const envelope = document.getElementById('envelope');
const loadIcon = document.getElementById('loadIcon');
const loadText = document.getElementById('loadText');
let leaving = false;

const copy = {
  sweet:['♡','甜甜的信正在打開……'],
  emotion:['𐙚','心事的信正在打開……'],
  mystery:['☾','神秘的信正在打開……'],
  midnight:['❦','午夜的信正在打開……']
};

document.querySelectorAll('.choice').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(leaving) return;
    leaving = true;
    const story = btn.dataset.story;
    loadIcon.textContent = copy[story][0];
    loadText.textContent = copy[story][1];

    envelope.classList.add('open');

    setTimeout(()=>envelope.classList.add('go'), 650);
    setTimeout(()=>{
      location.href = `./index-1.html?story=${encodeURIComponent(story)}&v=7#scripts`;
    }, 1450);
  });
});

// Decorative falling petals.
const petals = document.getElementById('petals');
for(let i=0;i<22;i++){
  const p=document.createElement('i');
  p.className='petal';
  p.style.left=(Math.random()*100)+'%';
  p.style.animationDuration=(6+Math.random()*7)+'s';
  p.style.animationDelay=(-Math.random()*9)+'s';
  p.style.opacity=(.25+Math.random()*.45);
  p.style.transform=`scale(${.7+Math.random()*.8})`;
  petals.appendChild(p);
}
</script>
</body>
</html>
