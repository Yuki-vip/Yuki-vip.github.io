<style>
:root{
  --ink:#684c59;
  --muted:#9f7787;
  --pink:#d57d9d;
  --pink2:#f6dde7;
  --cream:#fffaf2;
  --line:#ecd8df;
  --shadow:0 20px 50px rgba(101,70,85,.14);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,219,112,.28),transparent 26%),
    radial-gradient(circle at 84% 80%,rgba(228,157,187,.26),transparent 28%),
    linear-gradient(160deg,#fffaf3,#fff4f8 58%,#fffaf2);
}
.loading-stage,
.letter-stage{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
}
.loading-stage{
  position:fixed;
  inset:0;
  z-index:20;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,221,119,.24),transparent 24%),
    linear-gradient(160deg,#fffaf4,#fff4f8);
  transition:opacity .45s ease,visibility .45s ease;
}
.loading-stage.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.loader{
  text-align:center;
  color:#8f6878;
}
.loader-envelope{
  font-size:58px;
  animation:float 1s ease-in-out infinite alternate;
  filter:drop-shadow(0 8px 12px rgba(108,70,87,.12));
}
.loader-text{
  margin-top:10px;
  font-size:14px;
  font-weight:900;
  letter-spacing:.08em;
}
.loader-dots::after{
  content:"";
  animation:dots 1.2s steps(4,end) infinite;
}
@keyframes float{to{transform:translateY(-7px) rotate(2deg)}}
@keyframes dots{
  0%{content:""}
  25%{content:"."}
  50%{content:".."}
  75%,100%{content:"..."}
}

.letter-stage{
  opacity:0;
  transform:translateY(16px);
  transition:opacity .55s ease,transform .55s ease;
}
.letter-stage.show{
  opacity:1;
  transform:translateY(0);
}
.letter-wrap{
  width:min(760px,95vw);
}
.letter-paper{
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:var(--shadow);
  padding:clamp(24px,5vw,46px);
}
.letter-paper:before{
  content:"";
  position:absolute;
  width:180px;height:180px;
  border-radius:50%;
  background:rgba(255,215,101,.15);
  right:-70px;top:-72px;
}
.letter-paper:after{
  content:"";
  position:absolute;
  width:150px;height:150px;
  border-radius:50%;
  background:rgba(232,165,193,.14);
  left:-65px;bottom:-70px;
}
.letter-content{position:relative;z-index:2}
.to{
  font-size:14px;
  font-weight:900;
  color:#b56e8b;
  margin-bottom:24px;
}
.foreword{
  font-size:15px;
  line-height:1.9;
  color:#755764;
}
.foreword strong{
  color:#5f4350;
  font-size:clamp(21px,4vw,30px);
}
.choose-title{
  margin:24px auto 15px;
  width:min(360px,100%);
  text-align:center;
  border-top:1px solid #d9bfc9;
  border-bottom:1px solid #d9bfc9;
  padding:10px 8px;
  font-weight:950;
  font-size:16px;
  letter-spacing:.04em;
}
.choices{
  display:grid;
  gap:10px;
}
.choice{
  width:100%;
  appearance:none;
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px 15px;
  text-align:left;
  background:#fff;
  color:#755563;
  font-family:inherit;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.choice:hover,.choice:active{
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(105,71,87,.08);
}
.choice b{
  display:block;
  font-size:14px;
  margin-bottom:4px;
}
.choice span{
  display:block;
  color:#9d7787;
  font-size:12px;
  line-height:1.6;
}
.choice.a{background:#fffbed}
.choice.b{background:#fff3f7}
.choice.c{background:#f7f4ff}
.choice.d{background:#f8f3f6}

.departure{
  position:fixed;
  inset:0;
  z-index:30;
  display:grid;
  place-items:center;
  background:rgba(255,248,251,.92);
  backdrop-filter:blur(5px);
  opacity:0;
  visibility:hidden;
  transition:opacity .3s ease,visibility .3s ease;
}
.departure.show{
  opacity:1;
  visibility:visible;
}
.departure-box{
  text-align:center;
  color:#755261;
  font-weight:900;
}
.departure-icon{
  font-size:46px;
  margin-bottom:8px;
  animation:float .75s ease-in-out infinite alternate;
}

@media(max-width:620px){
  .letter-stage{padding:12px}
  .letter-paper{padding:24px 18px;border-radius:22px}
  .to{margin-bottom:18px;font-size:13px}
  .foreword{font-size:14px}
  .choose-title{margin-top:20px}
  .choice{padding:12px 13px}
}

.typewriter-wrap{
  margin:18px auto 0;
  width:min(720px,94vw);
  min-height:72px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:5px;
  padding:2px 8px 0;
}
.typewriter-line{
  display:block;
  min-height:1.9em;
  color:#b06e88;
  font-size:13px;
  font-weight:900;
  letter-spacing:.035em;
  line-height:1.9;
}

@keyframes blink{50%{opacity:0}}
@media(max-width:620px){
  .typewriter-wrap{
    margin-top:14px;
    min-height:86px;
    padding:0 10px 2px;
  }
  .typewriter-line{
    font-size:12px;
    line-height:1.85;
  }
}





/* ===== v17：每行 0.1 秒出現 → 選項依序浮現 → 結尾每行 0.1 秒 ===== */
.intro-type,
.ending-type{
  min-height:1.2em;
}
.intro-type.typing::after,
.ending-type.typing::after{
  content:"▋";
  display:inline-block;
  margin-left:2px;
  color:#d18ba6;
  animation:blink 1s step-end infinite;
}
.choice-rise{
  opacity:0;
  transform:translateY(24px);
  transition:
    opacity .68s ease,
    transform .68s cubic-bezier(.2,.75,.2,1),
    box-shadow .18s ease;
  pointer-events:none;
}
.choice-rise.show{
  opacity:1;
  transform:translateY(0);
}
.choice-rise.ready{
  pointer-events:auto;
  cursor:pointer;
}
.choice-rise.ready:hover,
.choice-rise.ready:active{
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(105,71,87,.08);
}

</style>
</head>

<body>
<div class="loading-stage" id="loadingStage">
  <div class="loader">
    <div class="loader-envelope">✉️</div>
    <div class="loader-text">信封正在加載中<span class="loader-dots"></span></div>
  </div>
</div>

<main class="letter-stage" id="letterStage">
  <div class="letter-wrap">
    <article class="letter-paper">
      <div class="letter-content">
        <div class="to intro-type" data-text="💌 To. 即將成為故事主角的你"></div>

        <div class="foreword">
          <div class="intro-type foreword-line" data-text="嗨，你好呀。"></div>
          <div class="foreword-gap"></div>

          <div class="intro-type foreword-line" data-text="你的信件已經送達。"></div>
          <div class="intro-type foreword-line" data-text="在打開之前，先回答我一個小問題"></div>

          <div class="foreword-gap small"></div>
          <strong class="intro-type question-line" data-text="今晚，你想收到什麼樣的故事？"></strong>
        </div>

        <div class="choose-title intro-type" data-text="✉︎　請選擇你的信件"></div>

        <div class="choices">
          <button class="choice a choice-rise" data-story="sweet" disabled>
            <b>♡ A｜甜甜的信</b>
            <span>想笑、想玩，和大家一起鬧一鬧？</span>
          </button>

          <button class="choice b choice-rise" data-story="emotion" disabled>
            <b>𐙚 B｜心事的信</b>
            <span>想沉浸在角色裡，感受一段故事？</span>
          </button>

          <button class="choice c choice-rise" data-story="mystery" disabled>
            <b>☾ C｜神秘的信</b>
            <span>喜歡線索、推理，想親手找出真相？</span>
          </button>

          <button class="choice d choice-rise" data-story="midnight" disabled>
            <b>❦ D｜午夜的信</b>
            <span>如果故事有點可怕……你敢打開嗎？</span>
          </button>
        </div>
      </div>
    </article>

    <div class="typewriter-wrap" aria-live="polite">
      <span class="typewriter-line ending-type" data-text="「不管你選中了哪一封，我都會在故事裡等你。」"></span>
      <span class="typewriter-line ending-type" data-text="「下一頁，換你寫下自己的故事。」"></span>
    </div>
  </div>
</main>

<div class="departure" id="departure">
  <div class="departure-box">
    <div class="departure-icon" id="departureIcon">✉️</div>
    <div id="departureText">信件已選好，正在前往故事……</div>
  </div>
</div>

<script>
const loadingStage = document.getElementById('loadingStage');
const letterStage = document.getElementById('letterStage');
const departure = document.getElementById('departure');
const departureIcon = document.getElementById('departureIcon');
const departureText = document.getElementById('departureText');

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function showLine(el, totalDuration=1000){
  const text = el.dataset.text || "";
  const chars = Array.from(text);

  el.textContent = "";
  el.classList.add("typing");

  const perChar = Math.max(4, totalDuration / Math.max(chars.length, 1));

  for(const ch of chars){
    el.textContent += ch;
    await wait(perChar);
  }

  el.classList.remove("typing");
}

async function revealChoices(){
  const choices = [...document.querySelectorAll(".choice-rise")];

  for(const choice of choices){
    choice.classList.add("show");
    await wait(420); // A → B → C → D 依序由下往上浮現
  }
}

async function showEnding(){
  const ending = [...document.querySelectorAll(".ending-type")];

  for(let i=0;i<ending.length;i++){
    await showLine(ending[i]);
    if(i < ending.length - 1){
      await wait(420); // 兩句之間多一點停頓
    }
  }
}

async function startTypewriter(){
  const intro = [...document.querySelectorAll(".intro-type")];

  // 前三行依你指定的節奏：
  // 第1行 2.5秒、第2行 2.5秒、第3行 5秒
  // 後面的前言則維持 1秒/行
  const introDurations = [2500, 2500, 5000, 1000, 1000, 1000];

  for(let i=0;i<intro.length;i++){
    await showLine(intro[i], introDurations[i] || 1000);

    if(i < intro.length - 1){
      // 第二行之後稍微多停一下
      await wait(i === 1 ? 420 : 180);
    }
  }

  // A/B/C/D 維持一個一個由下往上浮現
  await wait(220);
  await revealChoices();

  // 結尾兩句維持原本節奏
  await wait(650);
  await showEnding();

  document.querySelectorAll(".choice-rise").forEach(btn=>{
    btn.disabled = false;
    btn.classList.add("ready");
  });
}

setTimeout(()=>{
  loadingStage.classList.add('hide');
  letterStage.classList.add('show');
  setTimeout(startTypewriter, 500);
}, 1100);

const storyCopy = {
  sweet:['♡','甜甜的信已選好，正在前往故事……'],
  emotion:['𐙚','心事的信已選好，正在前往故事……'],
  mystery:['☾','神秘的信已選好，正在前往故事……'],
  midnight:['❦','午夜的信已選好，正在前往故事……']
};

document.querySelectorAll('.choice').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const story = btn.dataset.story;
    const [icon,text] = storyCopy[story];

    departureIcon.textContent = icon;
    departureText.textContent = text;
    departure.classList.add('show');

    setTimeout(()=>{
      location.href = `./index-1.html?story=${encodeURIComponent(story)}&v=24`;
    }, 650);
  });
});
</script>
</body>
</html>
